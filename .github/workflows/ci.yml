name: ci
on:
  workflow_call:
  pull_request:
# Cancel superseded PR runs; deploy calls get a unique group via run_id.
concurrency:
  group: ci-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: builder
          POSTGRES_PASSWORD: builder
          POSTGRES_DB: builder_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://builder:builder@localhost:5432/builder_test?sslmode=disable
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - id: app
        # app.env overrides app.defaults.env, key by key.
        run: awk -F= '/^[A-Z_]+=/ {v[$1]=$0} END {for (k in v) print v[k]}' app.defaults.env app.env >> "$GITHUB_OUTPUT"
      - uses: peaceiris/actions-hugo@2752ce1d29631191ea3f27c23495fa06139a5b78 # v3
        with:
          hugo-version: ${{ steps.app.outputs.HUGO_VERSION }}
          extended: true
      - run: hugo --minify
      - run: go vet ./...
      # -p 1: DB-backed packages share one test database
      - run: go test -p 1 ./...
      # Again inside a tenant schema, as multi-tenant mode runs it (TENANCY.md).
      - run: |
          psql "$TEST_DATABASE_URL" -qc 'CREATE SCHEMA IF NOT EXISTS t_test'
          TEST_DATABASE_URL="$TEST_DATABASE_URL&search_path=t_test" go test -p 1 ./...
