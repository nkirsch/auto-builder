name: deploy
on:
  push:
    branches: [master]
  workflow_dispatch:
concurrency:
  group: deploy
  cancel-in-progress: false
permissions:
  contents: read
  id-token: write
# Tests and both image builds run in parallel; deploy waits for all three.
jobs:
  test:
    uses: ./.github/workflows/ci.yml
  image:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: server
            file: Dockerfile
          - name: runner
            file: Dockerfile.runner
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER }}
      # gcloud is preinstalled on ubuntu-latest; installing latest costs ~25s per job.
      - uses: google-github-actions/setup-gcloud@v3
        with:
          skip_install: true
      - run: gcloud auth configure-docker ${{ vars.GCP_REGION }}-docker.pkg.dev --quiet
      - uses: docker/setup-buildx-action@v3
      # Weekly value: refreshes the runner's Claude Code install despite layer caching.
      - id: week
        run: echo "week=$(date -u +%G-W%V)" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.file }}
          platforms: linux/amd64
          push: true
          tags: ${{ vars.IMAGE }}/${{ matrix.name }}:${{ github.sha }}
          build-args: TOOLS_WEEK=${{ steps.week.outputs.week }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,scope=${{ matrix.name }},mode=max
  deploy:
    needs: [test, image]
    runs-on: ubuntu-latest
    steps:
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER }}
      # gcloud is preinstalled on ubuntu-latest; installing latest costs ~25s per job.
      - uses: google-github-actions/setup-gcloud@v3
        with:
          skip_install: true
      - name: deploy server
        run: >
          gcloud run deploy builder --project ${{ vars.GCP_PROJECT }} --region ${{ vars.GCP_REGION }}
          --image ${{ vars.IMAGE }}/server:${{ github.sha }}
          --update-env-vars GIT_SHA=${{ github.sha }} --quiet
      - name: update runner job
        run: >
          gcloud run jobs update builder-runner --project ${{ vars.GCP_PROJECT }} --region ${{ vars.GCP_REGION }}
          --image ${{ vars.IMAGE }}/runner:${{ github.sha }} --quiet
