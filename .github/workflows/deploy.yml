name: deploy
on:
  push:
    branches: [master]
  workflow_dispatch:
concurrency:
  group: deploy
  cancel-in-progress: false
permissions:
  contents: read
  id-token: write
jobs:
  test:
    uses: ./.github/workflows/ci.yml
  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER }}
      - uses: google-github-actions/setup-gcloud@v2
      - run: gcloud auth configure-docker ${{ vars.GCP_REGION }}-docker.pkg.dev --quiet
      - uses: docker/setup-buildx-action@v3
      - name: server image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ vars.IMAGE }}/server:${{ github.sha }}
      - name: runner image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.runner
          platforms: linux/amd64
          push: true
          tags: ${{ vars.IMAGE }}/runner:${{ github.sha }}
      - name: deploy server
        run: >
          gcloud run deploy builder --project ${{ vars.GCP_PROJECT }} --region ${{ vars.GCP_REGION }}
          --image ${{ vars.IMAGE }}/server:${{ github.sha }}
          --update-env-vars GIT_SHA=${{ github.sha }} --quiet
      - name: update runner job
        run: >
          gcloud run jobs update builder-runner --project ${{ vars.GCP_PROJECT }} --region ${{ vars.GCP_REGION }}
          --image ${{ vars.IMAGE }}/runner:${{ github.sha }} --quiet
