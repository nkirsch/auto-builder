{{define "layout"}}<!doctype html>
<html lang="en"{{with .Theme}} data-theme="{{.}}"{{end}}>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{.Title}} · auto-builder</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header>
  <nav>
    <a href="/" class="brand">auto-builder{{with .Version}} <span class="version" title="{{$.GitSHA}}">{{.}}</span>{{end}}</a>
    <a href="/items/new">New</a>
    <a href="/inbox">Inbox{{if .Unread}} <span class="count">{{.Unread}}</span>{{end}}</a>
    <a href="/runs">Runs</a>
    {{if .Me.IsAdmin}}<a href="/admin">Admin</a>{{end}}
    <form method="post" action="/theme" class="theme">
      <input type="hidden" name="back" value="{{.Path}}">
      <button class="link to-dark" name="theme" value="dark" title="Dark mode" aria-label="Switch to dark mode">☾</button>
      <button class="link to-light" name="theme" value="light" title="Light mode" aria-label="Switch to light mode">☀</button>
    </form>
    <form method="post" action="/auth/logout" class="logout">
      <button class="link" title="Sign out">{{.Me.Login}} ⎋</button>
    </form>
  </nav>
</header>
<main>
{{with .Flash}}<p class="flash">{{.}}</p>{{end}}
{{template "content" .}}
</main>
<footer>{{short .GitSHA}}</footer>
</body>
</html>{{end}}
