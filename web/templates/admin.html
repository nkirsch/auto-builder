{{define "content"}}
<h1>Members</h1>
<ul class="items">
  {{range .Data}}
  <li class="row">
    {{if .AvatarURL}}<img src="{{.AvatarURL}}&s=48" alt="" class="avatar">{{end}}
    <b>{{.Login}}</b> <span class="badge">{{.Role}}</span>
    <span class="muted">{{if .LastSeen}}seen {{ago .LastSeen}}{{else}}never signed in{{end}}</span>
    <span class="spacer"></span>
    {{if ne .Login $.Me.Login}}
    <form method="post" action="/admin/members/{{.Login}}/delete"><button class="secondary">Remove</button></form>
    {{end}}
  </li>
  {{end}}
</ul>
<h2>Add or change a member</h2>
<form method="post" action="/admin/members" class="row">
  <input name="login" placeholder="GitHub login" required>
  <select name="role"><option value="member">member</option><option value="admin">admin</option></select>
  <button>Save</button>
</form>
<h2>Builder</h2>
<form method="post" action="/admin/run"><button>Run now</button></form>
{{end}}
