{{define "layout"}}<!doctype html>
<html lang="en"{{with .Theme}} data-theme="{{.}}"{{end}}>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{.Title}} · auto-builder</title>
<meta name="description" content="A board where asks become pull requests, built and shipped by an unattended Claude Code agent.">
<meta property="og:site_name" content="auto-builder">
<meta property="og:type" content="website">
<meta property="og:title" content="auto-builder">
<meta property="og:description" content="A board where asks become pull requests, built and shipped by an unattended Claude Code agent.">
<meta property="og:url" content="{{.BaseURL}}/">
<meta property="og:image" content="{{.BaseURL}}/static/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="/static/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header>
  {{if .Me.Login}}<nav>
    <a href="/" class="brand">auto-builder{{with .Version}} <span class="version" title="{{$.GitSHA}}">{{.}}</span>{{end}}</a>
    <a href="/items/new">New</a>
    <a href="/inbox">Inbox{{if .Unread}} <span class="count">{{.Unread}}</span>{{end}}</a>
    <a href="/runs">Runs</a>
    {{if .Me.IsAdmin}}<a href="/admin">Admin</a>{{end}}
    <form method="post" action="/theme" class="theme">
      <input type="hidden" name="back" value="{{.Path}}">
      <button class="link to-dark" name="theme" value="dark" title="Dark mode" aria-label="Switch to dark mode">☾</button>
      <button class="link to-light" name="theme" value="light" title="Light mode" aria-label="Switch to light mode">☀</button>
    </form>
    <form method="post" action="/auth/logout" class="logout">
      <button class="link" title="Sign out">{{.Me.Login}} ⎋</button>
    </form>
  </nav>{{else}}<nav><a href="/" class="brand">auto-builder</a></nav>{{end}}
</header>
<main>
{{with .Flash}}<p class="flash">{{.}}</p>{{end}}
{{template "content" .}}
</main>
<footer>{{short .GitSHA}}</footer>
</body>
</html>{{end}}
