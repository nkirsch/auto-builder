{{define "content"}}
<section class="signin">
  <img src="{{base}}/static/icon.svg" alt="" width="72" height="72">
  {{template "brand-login" .}}
  {{if .Data.Google}}<a class="button" href="{{base}}/auth/google?next={{.Data.Next}}">Sign in with Google</a>{{end}}
  {{if .Data.GitHub}}<a class="button{{if .Data.Google}} secondary{{end}}" href="{{base}}/auth/github?next={{.Data.Next}}">Sign in with GitHub</a>{{end}}
  <p class="hint">Members only. Not a member? Ask the admin to add you.</p>
</section>
{{end}}
